name: smartbancs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartbancs
      POSTGRES_USER: smartbancs
      POSTGRES_PASSWORD: smartbancs
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbancs -d smartbancs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://smartbancs:smartbancs@postgres:5432/smartbancs
      SERVICE_NAME: smartbancs-api
      LOG_FILE: /app/logs/api.log
      METRICS_FILE: /app/logs/metrics.prom
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql://smartbancs:smartbancs@postgres:5432/smartbancs
      AI_SERVICE_URL: http://ai-service:8001
      SERVICE_NAME: smartbancs-worker
      LOG_FILE: /app/logs/worker.log
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build: ./ai-service
    environment:
      SERVICE_NAME: smartbancs-ai-service
      LOG_FILE: /app/logs/ai-service.log
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
